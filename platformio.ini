[platformio]
default_envs = esp32dev

; Firmware (ESP-IDF 5.x)
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = src/web/index.html
; App de 1,5 MB (Wi-Fi + HTTP não cabem com folga no padrão de 1 MB)
board_build.partitions = partitions_singleapp_large.csv

; Testes da lógica pura (lib/hacore) no computador: pio test -e native
; Requer um gcc no PATH (no Windows: MinGW-w64 / MSYS2).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu11 -lm
